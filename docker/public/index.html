<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RD Pulse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header h1 span { color: #6366f1; }

    .container { max-width: 720px; margin: 40px auto; padding: 0 24px; }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #4f46e5; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .status-pill.running { background: #fef9c3; color: #854d0e; }
    .status-pill.idle    { background: #f1f5f9; color: #64748b; }
    .status-pill.error   { background: #fee2e2; color: #991b1b; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .report-list { list-style: none; }

    .report-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .report-item:last-child { border-bottom: none; }

    .report-item time {
      font-size: 13px;
      color: #475569;
    }

    .report-item a {
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
      text-decoration: none;
    }

    .report-item a:hover { text-decoration: underline; }

    .empty {
      text-align: center;
      padding: 32px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #c7d2fe;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #991b1b;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>RD <span>Pulse</span></h1>
  <span id="cron-label" style="font-size:12px;color:#94a3b8"></span>
</header>

<div class="container">
  <div class="actions">
    <button id="run-btn" onclick="runReport()">Generate Report Now</button>
    <span id="status-pill" class="status-pill idle">Idle</span>
  </div>

  <div id="error-banner" class="error-banner"></div>

  <div class="card">
    <div class="section-title">Reports</div>
    <ul class="report-list" id="report-list">
      <li class="empty">No reports yet — click "Generate Report Now" to create one.</li>
    </ul>
  </div>
</div>

<script>
  let polling = false;

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
      + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function renderReports(reports) {
    const list = document.getElementById('report-list');
    if (!reports.length) {
      list.innerHTML = '<li class="empty">No reports yet — click "Generate Report Now" to create one.</li>';
      return;
    }
    list.innerHTML = reports.map((r, i) => `
      <li class="report-item">
        <time>${formatDate(r.createdAt)}</time>
        <a href="${r.url}" target="_blank">${i === 0 ? 'Latest report →' : 'View →'}</a>
      </li>
    `).join('');
  }

  function setStatus(isRunning, lastError) {
    const pill = document.getElementById('status-pill');
    const btn = document.getElementById('run-btn');
    const banner = document.getElementById('error-banner');

    if (isRunning) {
      pill.className = 'status-pill running';
      pill.innerHTML = '<span class="spinner"></span>Generating…';
      btn.disabled = true;
    } else if (lastError) {
      pill.className = 'status-pill error';
      pill.textContent = 'Error';
      btn.disabled = false;
      banner.style.display = 'block';
      banner.textContent = lastError;
    } else {
      pill.className = 'status-pill idle';
      pill.textContent = 'Idle';
      btn.disabled = false;
      banner.style.display = 'none';
    }
  }

  async function poll() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      setStatus(data.isRunning, data.lastError);
      renderReports(data.reports);
      if (data.isRunning) setTimeout(poll, 3000);
      else polling = false;
    } catch (e) {
      polling = false;
    }
  }

  async function runReport() {
    document.getElementById('error-banner').style.display = 'none';
    await fetch('/api/run', { method: 'POST' });
    if (!polling) { polling = true; poll(); }
  }

  // Initial load
  poll();
  setInterval(poll, 30000);
</script>
</body>
</html>
